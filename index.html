<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c4cf1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مجموعات الدروس</title>
<style>
:root{--bg:#f6f3ff;--sf:#fff;--tx:#2a2350;--mut:#7a73a0;--ln:#e8e3fa;--pr:#6c4cf1;--tn:#efe9ff;--ac:#00a99a;--g:#12945f;--g2:#d9f6e8;--r:#e5484d;--r2:#ffe3e5;--a:#b86e00;--a2:#fff0c9;--w2:#eeebf8;--sh:0 3px 14px rgba(90,60,200,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.55 "Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#6c4cf1,#a24bf4 62%,#ff6fa5);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 20px;display:flex;align-items:center;gap:12px;border-radius:0 0 26px 26px;box-shadow:0 6px 20px rgba(108,76,241,.28);overflow:hidden}
header::after{content:"";position:absolute;inset-inline-end:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
header h1{margin:0;font-size:1.35rem;line-height:1.3}header p{margin:0;font-size:.85rem;opacity:.9}
.bk{flex:none;background:rgba(255,255,255,.22);color:#fff;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;font-size:1.3rem}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:1rem;margin:22px 4px 8px;color:var(--tx);font-weight:800}
button{font:inherit;border:0;background:var(--tn);color:var(--pr);border-radius:14px;padding:0 16px;min-height:46px;cursor:pointer;font-weight:700;transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.95)}
:focus-visible{outline:3px solid #ffb020;outline-offset:2px}
.pri{background:linear-gradient(135deg,#6c4cf1,#8f6bff);color:#fff;box-shadow:0 4px 12px rgba(108,76,241,.3)}
.dan{background:var(--r2);color:var(--r)}.wide{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--pr);outline:0}
input[type=radio]{width:auto;min-height:0;margin-inline-end:8px}
textarea{resize:vertical;min-height:84px}
label{display:block;margin:12px 2px 4px;color:var(--mut);font-size:.88rem;font-weight:700}
.opt label{color:var(--tx);font-weight:400;font-size:1rem;margin:8px 0}
.card{background:var(--sf);border-radius:20px;padding:14px;margin:10px 0;box-shadow:var(--sh);animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(n+6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:none}}
@keyframes ring{0%{box-shadow:0 6px 18px rgba(255,111,165,.5),0 0 0 0 rgba(255,111,165,.45)}70%{box-shadow:0 6px 18px rgba(255,111,165,.5),0 0 0 14px rgba(255,111,165,0)}100%{box-shadow:0 6px 18px rgba(255,111,165,.5),0 0 0 0 rgba(255,111,165,0)}}
.row{display:flex;gap:8px}.row>*{flex:1}
.tap{cursor:pointer;transition:transform .15s}.tap:active{transform:scale(.98)}.dim{opacity:.6}
.grp,.les{display:flex;align-items:center;gap:12px}.grp{cursor:pointer}
.gr{flex:1;min-width:0}.gr b{display:block}.gr>span{color:var(--mut);font-size:.88rem;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.go{color:var(--mut);font-size:1.7rem}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem}
.cnt{text-align:center;line-height:1.15;color:var(--ac);min-width:44px}.cnt b{display:block;font-size:1.5rem}.cnt small{font-size:.75rem;color:var(--mut)}
.tm{flex:none;min-width:78px;text-align:center;font-weight:800;color:var(--pr);background:var(--tn);border-radius:14px;padding:10px 6px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--sf);box-shadow:var(--sh);border-radius:16px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:1.45rem;color:var(--pr);line-height:1.2}.stats span{font-size:.8rem;color:var(--mut)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;animation:pop .35s}
.chip.g{background:var(--g2);color:var(--g)}.chip.r{background:var(--r2);color:var(--r)}.chip.a{background:var(--a2);color:var(--a)}.chip.w{background:var(--w2);color:var(--mut)}
.st{border-inline-start:6px solid transparent}.st.a{border-inline-start-color:#ffb020}.st.r{border-inline-start-color:var(--r)}
.st .top{display:flex;align-items:center;gap:10px}
.st .nm{flex:1;min-width:0;background:none;text-align:start;padding:0;min-height:44px;color:var(--tx);font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.act{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:10px}
.pg{background:linear-gradient(135deg,#12a36b,#37c98c);color:#fff;animation:pop .3s}.rd{background:linear-gradient(135deg,#e5484d,#ff7a7f);color:#fff;animation:pop .3s}
.lg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.lg:last-child{border:0}
.lg .dot{width:12px;height:12px;border-radius:50%;flex:none}.lg span{flex:1}.lg small{color:var(--mut)}.lg button{min-height:36px;padding:0 10px;background:none;color:var(--mut)}
.note{background:var(--a2);color:var(--a);border-radius:16px;padding:12px;margin:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.alert{background:var(--r2);color:var(--r);border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:700;animation:up .4s both}.alert.warm{background:var(--a2);color:var(--a)}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:1.05rem}
.wk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}.wk:last-child{border:0}.wk b{min-width:76px}.wk>span{flex:1}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border-radius:12px;padding:8px;min-height:54px;color:var(--tx);font-weight:400}
.slot:hover,.slot:active{background:var(--tn)}.slot.bad{background:var(--r2)}.slot .t{flex:none;min-width:118px;color:var(--pr);font-weight:800;font-size:.88rem}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.dh b{font-size:1.05rem}.today-c{outline:3px solid #ff6fa5;outline-offset:-3px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#ff7a59,#ff6fa5);color:#fff;border-radius:99px;min-height:54px;padding:0 22px;z-index:6;animation:ring 2.4s infinite}
nav{position:fixed;inset:auto 10px calc(8px + env(safe-area-inset-bottom));background:var(--sf);border-radius:24px;box-shadow:0 8px 28px rgba(90,60,200,.22);display:flex;z-index:7;padding:4px}
nav button{flex:1;background:none;border-radius:18px;color:var(--mut);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76rem;padding:0}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pr);background:var(--tn)}nav button.on svg{stroke-width:2.5;animation:bob .45s}
dialog{border:0;border-radius:26px 26px 0 0;width:100%;max-width:520px;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));direction:rtl;background:var(--sf);color:var(--tx);animation:up .3s both}
dialog::backdrop{background:rgba(30,20,70,.5)}dialog h2{margin:0 0 4px;font-size:1.15rem}
#toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom));margin:auto;max-width:360px;text-align:center;background:#2a2350;color:#fff;border-radius:14px;padding:10px 14px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:none}
button:disabled{opacity:.4}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#6c4cf1,#ff6fa5);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:24px}
#lock[hidden]{display:none}#lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.4em}#lock button{background:#fff;min-width:180px}
@media(prefers-color-scheme:dark){:root{--bg:#171433;--sf:#221e45;--tx:#f0ecff;--mut:#a9a2d0;--ln:#352f63;--pr:#b5a2ff;--tn:#2f2a5c;--ac:#3fe0cf;--g:#5fe0a6;--g2:#12392c;--r:#ff8d92;--r2:#47202a;--a:#ffcf6b;--a2:#41330f;--w2:#2b2756;--sh:0 3px 14px rgba(0,0,0,.35)}
.pri{color:#fff}#toast{background:#f0ecff;color:#2a2350}}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="bar"></header>
<main id="app"></main>
<nav></nav>
<div id="toast" role="status"></div>
<div id="lock" hidden><h1>🔒 مجموعات الدروس</h1><input id="pin" type="password" inputmode="numeric" placeholder="الكود" onkeydown="if(event.key=='Enter')unlock()" aria-label="الكود السري"><button onclick="unlock()">فتح</button></div>
<dialog id="dlg"></dialog>
<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],ICD=['SU','MO','TU','WE','TH','FR','SA'];
let db;try{db=JSON.parse(localStorage.getItem('tutor'))}catch{}
db=db||{groups:[],set:{lead:30,morning:'08:00'}};
const save=()=>{try{localStorage.setItem('tutor',JSON.stringify(db))}catch{alert('تعذر الحفظ على المتصفح')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=t=>{let h=+t.slice(0,2);return (h%12||12)+':'+t.slice(3)+(h>=12?' م':' ص')};
const G=id=>db.groups.find(g=>g.id===id);
let view='today',gid=null,date=iso(new Date()),dp=null;

const att=(g,s)=>Object.values(g.att).filter(d=>d[s.id]===1).length;
function pay(g,s){const a=att(g,s),p=(g.pays[s.id]||[]).length,rem=p*4-a;
 if(!p)return a?{c:'r',t:'⚠️ مطلوب الدفع'}:{c:'w',t:'لم يدفع'};
 if(rem>0)return{c:'g',t:'✅ مدفوع · باقي '+rem};
 if(rem==0)return{c:'a',t:'🔔 خلصت الحصص المدفوعة'};
 return{c:'r',t:'⚠️ متأخر '+(-rem)+' حصة'}}

let sid=null,q='',showArch=false,mon=iso(new Date()).slice(0,7);
const IC={today:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',week:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13h2M14 13h2M8 17h2M14 17h2"/>',groups:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 4.5 2 4.5 5"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
document.querySelector('nav').innerHTML=[['today','اليوم'],['week','الأسبوع'],['groups','المجموعات'],['set','الإعدادات']].map(([v,t])=>`<button data-v="${v}" onclick="go('${v}')"><svg viewBox="0 0 24 24">${IC[v]}</svg>${t}</button>`).join('');
const act=()=>db.groups.filter(g=>!g.archived);
const sch=g=>g.sch.map(s=>DAYS[s.d]+' '+fmt(s.t)).join(' و ');
const dayName=d=>DAYS[new Date(d+'T12:00').getDay()]+' '+d;
const stT=s=>+s.t.slice(0,2)*60+ +s.t.slice(3),endT=s=>stT(s)+(s.m||60);
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const price=g=>parseFloat(g.price)||0,cancelled=(g,d)=>(g.cancel||{})[d];
function clash(d){const l=[],bad={};act().forEach(g=>g.sch.forEach(s=>{if(s.d==d)l.push({g,s})}));
 l.forEach((a,i)=>l.forEach((b,j)=>{if(i<j&&stT(a.s)<endT(b.s)&&stT(b.s)<endT(a.s)){(bad[a.g.id+a.s.t]=bad[a.g.id+a.s.t]||[]).push(b.g.name);(bad[b.g.id+b.s.t]=bad[b.g.id+b.s.t]||[]).push(a.g.name)}}));return{l,bad}}
function chk(id){const g=G(id),m=[];g.sch.forEach(s=>{const b=clash(s.d).bad[g.id+s.t];if(b&&!g.archived)m.push(DAYS[s.d]+' '+fmt(s.t)+' يتداخل مع: '+b.join('، '))});if(m.length)alert('⚠ تنبيه تداخل مواعيد\n'+m.join('\n'))}
function owed(g,s){const a=att(g,s),p=(g.pays[s.id]||[]).length,u=Math.max(0,Math.ceil(a/4)-p);return u||(a>0&&p*4==a?1:0)}
const gDue=g=>g.students.reduce((n,s)=>n+owed(g,s)*price(g),0);
function dues(){let tot=0,l=[];act().forEach(g=>g.students.forEach(s=>{const o=owed(g,s);if(o){const amt=o*price(g);tot+=amt;l.push({g,s,amt,p:pay(g,s)})}}));return{tot,l}}
function streak(g,s){let n=0;for(const d of Object.keys(g.att).filter(d=>g.att[d][s.id]!==undefined).sort().reverse()){if(g.att[d][s.id]===0)n++;else break}return n}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function R(){
 const g=G(gid),s=g&&g.students.find(x=>x.id==sid);
 const B={today:['اليوم',dayName(date)],week:['الأسبوع','اضغط على أي مجموعة لتعديل موعدها'],groups:['المجموعات',act().length+' مجموعة · '+act().reduce((n,x)=>n+x.students.length,0)+' طالب'],set:['الإعدادات','التذكير والأمان والنسخ الاحتياطي'],report:['التقرير المالي',mon],group:g?[g.name,sch(g)]:['',''],student:s?[s.name,g.name]:['','']}[view]||['',''];
 const back=view=='group'||view=='report'?"go('groups')":view=='student'?"go('group')":'';
 $('#bar').innerHTML=(back?`<button class="bk" onclick="${back}" aria-label="رجوع">→</button>`:'')+`<div><h1>${esc(B[0])}</h1><p>${esc(B[1])}</p></div>`;
 $('#app').innerHTML={today:vToday,week:vWeek,groups:vGroups,group:vGroup,student:vStudent,report:vReport,set:vSet}[view]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(['group','student','report'].includes(view)?'groups':view)))}
function go(v,id){view=v;if(id)gid=id;R();scrollTo(0,0)}
function openSt(id){sid=id;go('student')}
const dateIn=()=>`<input type="date" value="${date}" onchange="date=this.value||date;R()" aria-label="التاريخ">`;
const empty=t=>`<div class="empty">${t}</div>`;

const cinfo=v=>typeof v=='object'?v:{mk:'',t:''};
const pre=(g,s,d)=>Object.keys(g.att).filter(x=>x<d&&g.att[x][s.id]===1).length;
function dueNow(g,s,d){const p=pre(g,s,d),cap=(g.pays[s.id]||[]).length*4;
 if(cap>p)return{c:'g',t:'✅ مدفوع · باقي '+(cap-p)};if(cap==p)return{c:'a',t:'🔔 يدفع النهاردة'};return{c:'r',t:'⚠️ متأخر '+(p-cap)+' حصة'}}
const av=n=>{const h=[...n].reduce((x,c)=>x*31+c.charCodeAt(0)>>>0,7)%360;return `<div class="av" style="background:hsl(${h} 85% 91%);color:hsl(${h} 55% 32%)">${esc(n.trim()[0]||'؟')}</div>`};
function sessionsOn(d){const w=new Date(d+'T12:00').getDay(),L=[];
 act().forEach(g=>{g.sch.forEach(s=>{const c=cancelled(g,d);if(s.d==w)L.push({g,s,c:c?cinfo(c):null})});
  Object.entries(g.cancel||{}).forEach(([o,v])=>{const i=cinfo(v);if(i.mk===d)L.push({g,s:{t:i.t||g.sch[0].t,m:g.sch[0].m||60},mk:o})})});
 return L.sort((a,b)=>a.s.t.localeCompare(b.s.t))}
function ov(L){const bad={};L.forEach((a,i)=>L.forEach((b,j)=>{if(i<j&&!a.c&&!b.c&&stT(a.s)<endT(b.s)&&stT(b.s)<endT(a.s)){(bad[a.g.id+a.s.t]=bad[a.g.id+a.s.t]||[]).push(b.g.name);(bad[b.g.id+b.s.t]=bad[b.g.id+b.s.t]||[]).push(a.g.name)}}));return bad}
const pend=()=>{const r=[];act().forEach(g=>Object.entries(g.cancel||{}).forEach(([d,v])=>{if(cinfo(v).mk==='')r.push({g,d})}));return r};
const pendCard=P=>`<div class="card">${P.map(x=>`<div class="wk"><b>${esc(x.g.name)}</b><span>اعتذار يوم ${dayName(x.d)}</span><button onclick="mkDlg('${x.g.id}','${x.d}')">حدد موعد</button></div>`).join('')}</div>`;

function vToday(){
 const L=sessionsOn(date),bad=ov(L),D=dues(),P=pend();
 let h=dateIn();
 if('Notification'in window&&Notification.permission=='default')h+=`<div class="note"><span>🔔 فعّل الإشعارات عشان توصلك تذكيرات الدروس.</span><button class="pri" onclick="askN()">تفعيل</button></div>`;
 if(D.tot)h+=`<div class="alert">💰 مطلوب تحصيله ${D.tot} جنيه من ${D.l.length} طالب</div>`;
 h+=`<h2>📚 دروس اليوم</h2>`+(L.length?L.map(({g,s,c,mk})=>{const b=bad[g.id+s.t],k=g.students.map(x=>dueNow(g,x,date).c),n=k.filter(x=>x=='a').length,late=k.filter(x=>x=='r').length;
  return `<div class="card les tap${c?' dim':''}" onclick="gid='${g.id}';go('group')"><div class="tm">${fmt(s.t)}</div><div class="gr"><b>${esc(g.name)}</b><span>👥 ${g.students.length} طالب${c?' · 🙏 اعتذار المعلم'+(c.mk?' (التعويض '+c.mk+')':' (التعويض لم يحدد)'):g.att[date]?' · ✅ تم التسجيل':''}${mk?' · 🔁 تعويضية':''}</span><div class="tags">${!c&&n?`<span class="chip a">🔔 ${n} يدفع</span>`:''}${!c&&late?`<span class="chip r">⚠️ ${late} متأخر</span>`:''}${b?`<span class="chip r">⛔ تداخل مع ${esc(b.join('، '))}</span>`:''}</div></div><span class="go">‹</span></div>`}).join(''):empty('🎈<br>مفيش دروس في اليوم ده'));
 if(P.length)h+=`<h2>🔁 حصص مؤجلة محتاجة تعويض</h2>`+pendCard(P);
 if(D.l.length)h+=`<h2>💰 المبالغ المطلوبة</h2><div class="card">${D.l.map(x=>`<div class="wk"><b>${esc(x.s.name)}</b><span>${esc(x.g.name)}</span><span class="chip ${x.p.c}">${x.amt?x.amt+' ج':x.p.t}</span></div>`).join('')}</div>`;
 const ab=[];act().forEach(g=>g.students.forEach(s=>{const n=streak(g,s);if(n>=3)ab.push(`<div class="wk"><b>${esc(s.name)}</b><span>${esc(g.name)}</span><span class="chip r">غاب ${n} متتالية</span></div>`)}));
 if(ab.length)h+=`<h2>🚨 تنبيهات الغياب</h2><div class="card">${ab.join('')}</div>`;
 return h}

function vWeek(){const td=new Date(date+'T12:00').getDay();

function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.groups)throw 0;if(confirm('هيتم استبدال البيانات الحالية. متأكد؟')){db=d;save();go('today')}}catch{alert('الملف مش صالح')}};r.readAsText(f)}
function ics(){
 if(!db.groups.length)return alert('أضف مجموعات الأول');
 const p=n=>String(n).padStart(2,'0'),st=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//tutor//AR//','CALSCALE:GREGORIAN'];
 act().forEach(g=>g.sch.forEach((s,i)=>{const d=new Date();d.setHours(12,0,0,0);while(d.getDay()!=s.d)d.setDate(d.getDate()+1);
  const ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+s.t.replace(':','')+'00';
  L.push('BEGIN:VEVENT','UID:'+g.id+i+'@tutor','DTSTAMP:'+st,'DTSTART:'+ds,'DURATION:PT'+(s.m||60)+'M','RRULE:FREQ=WEEKLY;BYDAY='+ICD[s.d],...Object.keys(g.cancel||{}).filter(x=>new Date(x+'T12:00').getDay()==s.d).map(x=>'EXDATE:'+x.replace(/-/g,'')+'T'+s.t.replace(':','')+'00'),'SUMMARY:درس '+g.name,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:درس '+g.name,'TRIGGER:-PT'+db.set.lead+'M','END:VALARM','END:VEVENT')}));
 act().forEach(g=>Object.entries(g.cancel||{}).forEach(([o,v])=>{const i=cinfo(v);if(i.mk&&i.mk>=iso(new Date())){const ds=i.mk.replace(/-/g,'')+'T'+(i.t||'16:00').replace(':','')+'00';L.push('BEGIN:VEVENT','UID:mk'+g.id+o+'@tutor','DTSTAMP:'+st,'DTSTART:'+ds,'DURATION:PT'+(g.sch[0].m||60)+'M','SUMMARY:تعويض '+g.name,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:تعويض '+g.name,'TRIGGER:-PT'+db.set.lead+'M','END:VALARM','END:VEVENT')}}));L.push('END:VCALENDAR');download('دروسي.ics','text/calendar',L.join('\r\n'))}

function askN(){if(!('Notification'in window))return alert('المتصفح ده مش بيدعم الإشعارات');Notification.requestPermission().then(()=>R())}
function nt(t,b){if(!('Notification'in window)||Notification.permission!='granted')return;
 if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',dir:'rtl',lang:'ar'}));
 else{try{new Notification(t,{body:b})}catch{}}}
function tick(){
 const n=new Date(),k=iso(n),dow=n.getDay(),m=n.getHours()*60+n.getMinutes();
 let sent={};try{sent=JSON.parse(localStorage.getItem('sent'))||{}}catch{}
 Object.keys(sent).forEach(x=>{if(!x.startsWith(k))delete sent[x]});
 const td=sessionsOn(k).filter(x=>!x.c);
 td.sort((a,b)=>a.s.t.localeCompare(b.s.t));
 const [mh,mm]=(db.set.morning||'08:00').split(':');
 if(td.length&&m>=+mh*60+ +mm&&!sent[k+'m']){nt('دروس النهاردة',td.map(x=>x.g.name+' — '+fmt(x.s.t)).join('\n')+(dues().tot?'\nمطلوب تحصيله '+dues().tot+' جنيه':''));sent[k+'m']=1}
 td.forEach(({g,s})=>{const t=+s.t.slice(0,2)*60+ +s.t.slice(3),key=k+g.id+s.t;
  if(m>=t-db.set.lead&&m<t&&!sent[key]){nt('قرّب درس '+g.name,'الساعة '+fmt(s.t));sent[key]=1}});
 try{localStorage.setItem('sent',JSON.stringify(sent))}catch{}}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(view=='set')R()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(tick,30000);tick();R();lockUI();
</script>
</body>
