<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183454">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مجموعات الدروس</title>
<style>
:root{--bg:#f2f5f8;--sf:#fff;--tx:#13232f;--mut:#5f7080;--ln:#e0e6ec;--pr:#183454;--tn:#e6edf5;--ac:#0e7f73;--g:#17784f;--g2:#e1f3e9;--r:#b8381f;--r2:#fbe8e3;--a:#8a5a00;--a2:#fcefcf;--w2:#eceff3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.55 "Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:1.3rem;line-height:1.3}header p{margin:0;font-size:.85rem;opacity:.8}
.bk{flex:none;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;font-size:1.3rem}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:.95rem;margin:22px 4px 8px;color:var(--mut);font-weight:700}
button{font:inherit;border:0;background:var(--tn);color:var(--pr);border-radius:12px;padding:0 16px;min-height:46px;cursor:pointer;font-weight:600;transition:transform .08s}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--pr);color:#fff}.dan{background:var(--r2);color:var(--r)}.ghost{background:none;border:1px solid var(--ln);color:var(--tx)}.wide{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx)}
input[type=radio]{width:auto;min-height:0;margin-inline-end:8px}
label{display:block;margin:12px 2px 4px;color:var(--mut);font-size:.88rem;font-weight:600}
.opt label{color:var(--tx);font-weight:400;font-size:1rem;margin:8px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.grp{display:flex;align-items:center;gap:12px;cursor:pointer}.gr{flex:1;min-width:0}.gr b{display:block}.gr span{color:var(--mut);font-size:.88rem}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--tn);color:var(--pr);display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.cnt{text-align:center;line-height:1.15;color:var(--ac);min-width:44px}.cnt b{display:block;font-size:1.4rem}.cnt small{font-size:.75rem;color:var(--mut)}
.les{display:flex;align-items:center;gap:12px}
.tm{flex:none;min-width:76px;text-align:center;font-weight:700;color:var(--pr);background:var(--tn);border-radius:12px;padding:8px 6px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}
.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:1.45rem;color:var(--pr);line-height:1.2}.stats span{font-size:.8rem;color:var(--mut)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.g{background:var(--g2);color:var(--g)}.chip.r{background:var(--r2);color:var(--r)}.chip.a{background:var(--a2);color:var(--a)}.chip.w{background:var(--w2);color:var(--mut)}
.st .top{display:flex;align-items:center;gap:10px}
.st .nm{flex:1;min-width:0;background:none;text-align:start;padding:0;min-height:44px;color:var(--tx);font-size:1rem;overflow:hidden;text-overflow:ellipsis}
.act{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:10px}
.pg{background:var(--g);color:#fff}.rd{background:var(--r);color:#fff}
.lg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.lg:last-child{border:0}
.lg .dot{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1}.lg small{color:var(--mut)}
.lg button{min-height:36px;padding:0 10px;background:none;color:var(--mut)}
.note{background:var(--a2);color:var(--a);border-radius:14px;padding:12px;margin:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
.wk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}.wk:last-child{border:0}.wk b{min-width:76px}.wk span{flex:1}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ac);color:#fff;border-radius:99px;min-height:52px;padding:0 20px;box-shadow:0 6px 18px #0004;z-index:6}
nav{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav button{flex:1;background:none;border-radius:0;color:var(--mut);min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;padding:0}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}nav button.on svg{stroke-width:2.4}
dialog{border:0;border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));direction:rtl;background:var(--sf);color:var(--tx)}
dialog::backdrop{background:#0007}dialog h2{margin:0 0 4px;color:var(--tx);font-size:1.15rem}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));margin:auto;max-width:360px;text-align:center;background:#13232f;color:#fff;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.alert{background:var(--r2);color:var(--r);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:600}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border-radius:10px;padding:8px;min-height:54px;color:var(--tx);font-weight:400}
.slot:hover,.slot:active{background:var(--tn)}.slot.bad{background:var(--r2)}.slot .t{flex:none;min-width:118px;color:var(--ac);font-weight:700;font-size:.88rem}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.dh b{font-size:1.05rem}
.today-c{border:2px solid var(--ac)}textarea{resize:vertical;min-height:84px}
button:disabled{opacity:.4}
#lock{position:fixed;inset:0;background:var(--pr);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:24px}
#lock[hidden]{display:none}#lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.4em}#lock button{background:#fff;min-width:180px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1923;--sf:#16252f;--tx:#e8eef3;--mut:#93a4b3;--ln:#27394a;--pr:#10263f;--tn:#22384f;--ac:#3cc2b3;--g:#5cd19c;--g2:#173b2c;--r:#ff8f78;--r2:#43211b;--a:#f1c35f;--a2:#3b3012;--w2:#22313e}
.pri{background:#2d6cb5;color:#fff}.pg{background:#1f8a5b;color:#fff}.rd{background:#c8442f;color:#fff}.fab{color:#06231f}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="bar"></header>
<main id="app"></main>
<nav></nav>
<div id="toast" role="status"></div>
<div id="lock" hidden><h1>🔒 مجموعات الدروس</h1><input id="pin" type="password" inputmode="numeric" placeholder="الكود" onkeydown="if(event.key=='Enter')unlock()" aria-label="الكود السري"><button onclick="unlock()">فتح</button></div>
<dialog id="dlg"></dialog>
<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],ICD=['SU','MO','TU','WE','TH','FR','SA'];
let db;try{db=JSON.parse(localStorage.getItem('tutor'))}catch{}
db=db||{groups:[],set:{lead:30,morning:'08:00'}};
const save=()=>{try{localStorage.setItem('tutor',JSON.stringify(db))}catch{alert('تعذر الحفظ على المتصفح')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=t=>{let h=+t.slice(0,2);return (h%12||12)+':'+t.slice(3)+(h>=12?' م':' ص')};
const G=id=>db.groups.find(g=>g.id===id);
let view='today',gid=null,date=iso(new Date()),dp=null;

const att=(g,s)=>Object.values(g.att).filter(d=>d[s.id]===1).length;
function pay(g,s){const a=att(g,s),p=(g.pays[s.id]||[]).length,rem=p*4-a;
 if(!p)return a?{c:'r',t:'مطلوب الدفع'}:{c:'w',t:'لم يدفع'};
 if(rem>0)return{c:'g',t:'مدفوع · باقي '+rem};
 if(rem==0)return{c:'a',t:'خلصت الحصص المدفوعة'};
 return{c:'r',t:'متأخر '+(-rem)+' حصة'}}

let sid=null,q='',showArch=false,mon=iso(new Date()).slice(0,7);
const IC={today:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',week:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 13h2M14 13h2M8 17h2M14 17h2"/>',groups:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 4.5 2 4.5 5"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
document.querySelector('nav').innerHTML=[['today','اليوم'],['week','الأسبوع'],['groups','المجموعات'],['set','الإعدادات']].map(([v,t])=>`<button data-v="${v}" onclick="go('${v}')"><svg viewBox="0 0 24 24">${IC[v]}</svg>${t}</button>`).join('');
const act=()=>db.groups.filter(g=>!g.archived);
const sch=g=>g.sch.map(s=>DAYS[s.d]+' '+fmt(s.t)).join(' و ');
const dayName=d=>DAYS[new Date(d+'T12:00').getDay()]+' '+d;
const stT=s=>+s.t.slice(0,2)*60+ +s.t.slice(3),endT=s=>stT(s)+(s.m||60);
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const price=g=>parseFloat(g.price)||0,cancelled=(g,d)=>(g.cancel||{})[d];
function clash(d){const l=[],bad={};act().forEach(g=>g.sch.forEach(s=>{if(s.d==d)l.push({g,s})}));
 l.forEach((a,i)=>l.forEach((b,j)=>{if(i<j&&stT(a.s)<endT(b.s)&&stT(b.s)<endT(a.s)){(bad[a.g.id+a.s.t]=bad[a.g.id+a.s.t]||[]).push(b.g.name);(bad[b.g.id+b.s.t]=bad[b.g.id+b.s.t]||[]).push(a.g.name)}}));return{l,bad}}
function chk(id){const g=G(id),m=[];g.sch.forEach(s=>{const b=clash(s.d).bad[g.id+s.t];if(b&&!g.archived)m.push(DAYS[s.d]+' '+fmt(s.t)+' يتداخل مع: '+b.join('، '))});if(m.length)alert('⚠ تنبيه تداخل مواعيد\n'+m.join('\n'))}
function owed(g,s){const a=att(g,s),p=(g.pays[s.id]||[]).length,u=Math.max(0,Math.ceil(a/4)-p);return u||(a>0&&p*4==a?1:0)}
const gDue=g=>g.students.reduce((n,s)=>n+owed(g,s)*price(g),0);
function dues(){let tot=0,l=[];act().forEach(g=>g.students.forEach(s=>{const o=owed(g,s);if(o){const amt=o*price(g);tot+=amt;l.push({g,s,amt,p:pay(g,s)})}}));return{tot,l}}
function streak(g,s){let n=0;for(const d of Object.keys(g.att).filter(d=>g.att[d][s.id]!==undefined).sort().reverse()){if(g.att[d][s.id]===0)n++;else break}return n}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function R(){
 const g=G(gid),s=g&&g.students.find(x=>x.id==sid);
 const B={today:['اليوم',dayName(date)],week:['الأسبوع','اضغط على أي مجموعة لتعديل موعدها'],groups:['المجموعات',act().length+' مجموعة · '+act().reduce((n,x)=>n+x.students.length,0)+' طالب'],set:['الإعدادات','التذكير والأمان والنسخ الاحتياطي'],report:['التقرير المالي',mon],group:g?[g.name,sch(g)]:['',''],student:s?[s.name,g.name]:['','']}[view]||['',''];
 const back=view=='group'||view=='report'?"go('groups')":view=='student'?"go('group')":'';
 $('#bar').innerHTML=(back?`<button class="bk" onclick="${back}" aria-label="رجوع">→</button>`:'')+`<div><h1>${esc(B[0])}</h1><p>${esc(B[1])}</p></div>`;
 $('#app').innerHTML={today:vToday,week:vWeek,groups:vGroups,group:vGroup,student:vStudent,report:vReport,set:vSet}[view]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(['group','student','report'].includes(view)?'groups':view)))}
function go(v,id){view=v;if(id)gid=id;R();scrollTo(0,0)}
function openSt(id){sid=id;go('student')}
const dateIn=()=>`<input type="date" value="${date}" onchange="date=this.value||date;R()" aria-label="التاريخ">`;
const empty=t=>`<div class="empty">${t}</div>`;

function vToday(){
 const dow=new Date(date+'T12:00').getDay(),{l,bad}=clash(dow),D=dues();
 l.sort((a,b)=>a.s.t.localeCompare(b.s.t));
 let h=dateIn();
 if('Notification'in window&&Notification.permission=='default')h+=`<div class="note"><span>فعّل الإشعارات عشان توصلك تذكيرات الدروس.</span><button class="pri" onclick="askN()">تفعيل</button></div>`;
 if(D.tot)h+=`<div class="alert">💰 مطلوب تحصيله ${D.tot} جنيه من ${D.l.length} طالب</div>`;
 h+=`<h2>دروس اليوم</h2>`+(l.length?l.map(({g,s})=>{const c=cancelled(g,date),b=bad[g.id+s.t];return `<div class="card les"><div class="tm">${fmt(s.t)}</div><div class="gr"><b>${esc(g.name)}</b><span>${g.students.length} طالب${c?' · ملغاة':g.att[date]?' · تم التسجيل':''}</span>${b?`<span class="chip r">تداخل مع ${esc(b.join('، '))}</span>`:''}</div><button class="pri" onclick="gid='${g.id}';go('group')">${g.att[date]?'تعديل':'حضور'}</button></div>`}).join(''):empty('مفيش دروس في اليوم ده'));
 if(D.l.length)h+=`<h2>المبالغ المطلوبة</h2><div class="card">${D.l.map(x=>`<div class="wk"><b>${esc(x.s.name)}</b><span>${esc(x.g.name)}</span><span class="chip ${x.p.c}">${x.amt?x.amt+' ج':x.p.t}</span></div>`).join('')}</div>`;
 const ab=[];act().forEach(g=>g.students.forEach(s=>{const n=streak(g,s);if(n>=3)ab.push(`<div class="wk"><b>${esc(s.name)}</b><span>${esc(g.name)}</span><span class="chip r">غاب ${n} متتالية</span></div>`)}));
 if(ab.length)h+=`<h2>تنبيهات الغياب</h2><div class="card">${ab.join('')}</div>`;
 return h}

function vWeek(){const td=new Date(date+'T12:00').getDay();
 return [6,0,1,2,3,4,5].map(d=>{const {l,bad}=clash(d);l.sort((a,b)=>a.s.t.localeCompare(b.s.t));
 return `<div class="card${d==td?' today-c':''}"><div class="dh"><b>${DAYS[d]}</b><span><span class="chip ${l.length?'g':'w'}">${l.length} مجموعة</span>${Object.keys(bad).length?' <span class="chip r">⚠ تداخل</span>':''}</span></div>`+
 (l.map(({g,s})=>{const b=bad[g.id+s.t];return `<button class="slot${b?' bad':''}" onclick="editGroup('${g.id}')"><span class="t">${fmt(s.t)} – ${fmt(hm(endT(s)))}</span><span style="flex:1">${esc(g.name)}<br><small style="color:var(--mut)">${g.students.length} طالب${b?' · يتداخل مع '+esc(b.join('، ')):''}</small></span><span>✎</span></button>`}).join('')||'<div class="empty" style="padding:10px">لا توجد دروس</div>')+'</div>'}).join('')}

function gl(k){
 if(k.trim()){const r=[];db.groups.forEach(g=>g.students.forEach(s=>{if(s.name.includes(k.trim()))r.push(`<div class="card grp" onclick="gid='${g.id}';openSt('${s.id}')"><div class="av">${esc(s.name.trim()[0])}</div><div class="gr"><b>${esc(s.name)}</b><span>${esc(g.name)}</span></div><span class="chip ${pay(g,s).c}">${pay(g,s).t}</span></div>`)}));return r.join('')||empty('مفيش نتيجة')}
 const L=db.groups.filter(g=>showArch?g.archived:!g.archived);
 return L.map(g=>{const d=gDue(g);return `<div class="card grp" onclick="gid='${g.id}';go('group')"><div class="av">${esc(g.name.trim()[0]||'؟')}</div><div class="gr"><b>${esc(g.name)}${g.archived?' (مؤرشفة)':''}</b><span>${sch(g)}</span>${d?`<span class="chip r">مطلوب ${d} ج</span>`:''}</div><div class="cnt"><b>${g.students.length}</b><small>طالب</small></div></div>`}).join('')||empty(showArch?'مفيش مجموعات مؤرشفة':'لسه مفيش مجموعات.<br>اضغط «مجموعة جديدة» وابدأ.')}
function srch(v){q=v;$('#res').innerHTML=gl(v)}
function vGroups(){const n=db.groups.filter(g=>g.archived).length;
 return `<input placeholder="🔍 ابحث عن طالب" value="${esc(q)}" oninput="srch(this.value)" aria-label="بحث"><div class="row" style="margin:10px 0"><button onclick="go('report')">التقرير المالي</button><button onclick="showArch=!showArch;R()">${showArch?'المجموعات الحالية':'المؤرشفة ('+n+')'}</button></div><div id="res">${gl(q)}</div><button class="fab" onclick="editGroup()">+ مجموعة جديدة</button>`}

function vGroup(){
 const g=G(gid);if(!g){view='groups';return vGroups()}
 const A=g.att[date]||{},c=cancelled(g,date),mk=!g.sch.some(s=>s.d==new Date(date+'T12:00').getDay()),d=gDue(g);
 let h=`<div class="stats"><div><b>${g.students.length}</b><span>عدد الطلاب</span></div><div><b>${Object.keys(g.att).length}</b><span>حصص مسجلة</span></div><div><b>${d}</b><span>مطلوب (جنيه)</span></div></div>
 <p style="color:var(--mut);margin:8px 4px">${g.price?'سعر الـ 4 حصص: '+esc(g.price)+' جنيه':'لم يحدد سعر'}</p>
 <div class="row"><button onclick="editGroup('${g.id}')">تعديل</button><button onclick="arch('${g.id}')">${g.archived?'إلغاء الأرشفة':'أرشفة'}</button><button class="dan" onclick="delGroup('${g.id}')">حذف</button></div>
 <h2>ملاحظات المجموعة</h2><textarea placeholder="مستوى المجموعة، المنهج، واجبات..." oninput="G(gid).note=this.value;save()">${esc(g.note||'')}</textarea>
 <h2>كشف الحضور والدفع ${mk?'<span class="chip a">تعويضية</span>':''}${c?' <span class="chip r">ملغاة</span>':''}</h2>${dateIn()}
 <div class="row" style="margin-top:8px">${c?'':'<button onclick="allP()">✓ الكل حضر</button>'}<button class="${c?'':'dan'}" onclick="cancelDay()">${c?'إلغاء الإلغاء':'إلغاء حصة هذا اليوم'}</button></div>`;
 h+=g.students.map(s=>{const p=pay(g,s),n=streak(g,s);return `<div class="card st"><div class="top"><div class="av">${esc(s.name.trim()[0]||'؟')}</div><button class="nm" onclick="openSt('${s.id}')">${esc(s.name)}</button><span class="chip ${p.c}">${p.t}</span></div>${n>=3?`<span class="chip r" style="margin-top:8px">غاب ${n} مرات متتالية</span>`:''}
 <div class="act"><button ${c?'disabled':''} class="${A[s.id]===1?'pg':''}" onclick="mark('${s.id}',1)">حضر</button><button ${c?'disabled':''} class="${A[s.id]===0?'rd':''}" onclick="mark('${s.id}',0)">غاب</button><button onclick="addPay('${s.id}')">+ دفعة</button></div></div>`}).join('')||empty('لسه مفيش طلاب في المجموعة');
 return h+`<h2>إضافة طلاب</h2><div class="card"><input id="ns" placeholder="اسم الطالب (أو أكتر بفاصلة)" onkeydown="if(event.key=='Enter')addSt()"><button class="pri wide" style="margin-top:10px" onclick="addSt()">إضافة</button></div>`}

function vStudent(){
 const g=G(gid),s=g&&g.students.find(x=>x.id==sid);if(!s){view='group';return vGroup()}
 const p=pay(g,s),pys=g.pays[s.id]||[],ev=[];
 Object.keys(g.att).forEach(d=>{const v=g.att[d][s.id];if(v!==undefined)ev.push({d,k:v?'a':'b'})});
 pys.forEach((d,i)=>ev.push({d,k:'p',i}));ev.sort((x,y)=>y.d.localeCompare(x.d));
 const a=att(g,s),b=ev.filter(e=>e.k=='b').length,pc=a+b?Math.round(a*100/(a+b)):0,L={a:['حضر','var(--g)'],b:['غاب','var(--r)'],p:['دفعة (4 حصص)','var(--ac)']};
 return `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>الحالة${owed(g,s)?' · '+owed(g,s)*price(g)+' جنيه':''}</span><span class="chip ${p.c}">${p.t}</span></div>
 <div class="stats" style="grid-template-columns:repeat(4,1fr)"><div><b>${a}</b><span>حضر</span></div><div><b>${b}</b><span>غاب</span></div><div><b>${pc}%</b><span>نسبة الحضور</span></div><div><b>${pys.length}</b><span>دفعات</span></div></div>
 ${streak(g,s)>=3?`<div class="alert" style="margin-top:10px">غاب ${streak(g,s)} مرات متتالية</div>`:''}
 <div class="row" style="margin-top:12px"><button onclick="moveDlg()">نقل لمجموعة أخرى</button><button onclick="renSt()">تعديل الاسم</button></div>
 <h2>ملاحظات</h2><textarea placeholder="ملاحظات عن الطالب..." oninput="G(gid).students.find(x=>x.id==sid).note=this.value;save()">${esc(s.note||'')}</textarea>
 <h2>سجل الحضور والتسديد</h2><div class="card">${ev.map(e=>`<div class="lg"><i class="dot" style="background:${L[e.k][1]}"></i><span>${L[e.k][0]}<br><small>${dayName(e.d)}</small></span><button onclick="delEv('${e.d}','${e.k}',${e.i??-1})" aria-label="حذف السجل">×</button></div>`).join('')||empty('مفيش سجل لسه')}</div>
 <button class="dan wide" style="margin-top:12px" onclick="delSt('${s.id}')">حذف الطالب</button>`}

function vReport(){let T=0,P=0,O=0;
 const rows=db.groups.map(g=>{const pn=Object.values(g.pays).flat().filter(d=>d.startsWith(mon)).length,c=pn*price(g),ss=Object.keys(g.att).filter(d=>d.startsWith(mon)&&!cancelled(g,d)).length,o=g.archived?0:gDue(g);T+=c;P+=pn;O+=o;
 return `<div class="card"><b>${esc(g.name)}${g.archived?' (مؤرشفة)':''}</b><div class="wk"><span>المحصّل</span><b>${c} ج</b></div><div class="wk"><span>عدد الدفعات</span><b>${pn}</b></div><div class="wk"><span>حصص اتسجلت</span><b>${ss}</b></div><div class="wk"><span>متأخر حاليا</span><b>${o} ج</b></div></div>`}).join('');
 return `<input type="month" value="${mon}" onchange="mon=this.value||mon;R()" aria-label="الشهر"><div class="stats" style="margin-top:12px"><div><b>${T}</b><span>محصّل (جنيه)</span></div><div><b>${P}</b><span>دفعات</span></div><div><b>${O}</b><span>متأخر (جنيه)</span></div></div>`+(rows||empty('مفيش مجموعات'))}

function vSet(){
 return `<h2>التذكير</h2><div class="card"><label>أنبهني قبل الحصة بـ (دقيقة)</label><input type="number" min="0" max="240" value="${db.set.lead}" onchange="db.set.lead=+this.value||0;save()">
 <label>ملخص دروس اليوم الساعة</label><input type="time" value="${db.set.morning}" onchange="db.set.morning=this.value;save()">
 <div class="row" style="margin-top:12px"><button class="pri" onclick="askN()">تفعيل الإشعارات</button><button onclick="ics()">تذكير بالتقويم</button></div>
 <p style="color:var(--mut);font-size:.88rem;margin:10px 0 0">الإشعارات بتشتغل والتطبيق شغال أو في الخلفية. للتذكير المضمون حتى لو التطبيق مقفول حمّل ملف التقويم وافتحه مرة واحدة.</p></div>
 <h2>الأمان</h2><div class="card"><button class="wide" onclick="setPin()">${db.set.pin?'تغيير أو إلغاء الكود السري':'تعيين كود سري'}</button><p style="color:var(--mut);font-size:.88rem;margin:10px 0 0">الكود يمنع فتح التطبيق بدون إدخاله، وبيطلبه تاني لو سبت التطبيق دقيقة.</p></div>
 ${dp?'<h2>التثبيت</h2><button class="pri wide" onclick="dp.prompt();dp=null;R()">تثبيت التطبيق</button>':''}
 <h2>التصدير والنسخ الاحتياطي</h2><div class="card"><div class="row"><button onclick="csv()">تصدير كشف Excel</button><button onclick="shareFile('دروسي-نسخة.json','application/json',JSON.stringify(db))">مشاركة نسخة</button></div><div class="row" style="margin-top:8px"><button onclick="$('#imp').click()">استرجاع نسخة</button></div>
 <input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><p style="color:var(--mut);font-size:.88rem;margin:10px 0 0">البيانات محفوظة على تليفونك بس. شارك نسخة على واتساب أو درايف كل فترة.</p></div>`}

function allP(){const g=G(gid);if(cancelled(g,date))return;const a=g.att[date]=g.att[date]||{};g.students.forEach(s=>{if(a[s.id]===undefined)a[s.id]=1});save();R()}
function cancelDay(){const g=G(gid);g.cancel=g.cancel||{};if(g.cancel[date])delete g.cancel[date];else{if(g.att[date]&&!confirm('فيه حضور مسجل في اليوم ده وهيتمسح. متأكد؟'))return;delete g.att[date];g.cancel[date]=1}save();R()}
function arch(id){const g=G(id);g.archived=!g.archived;save();toast(g.archived?'تمت الأرشفة':'تم إلغاء الأرشفة');go('groups')}
const hs=s=>{let x=5381;for(const c of s)x=((x*33)^c.charCodeAt(0))>>>0;return x};
function lockUI(){if(!db.set.pin)return;$('#lock').hidden=false;setTimeout(()=>$('#pin').focus(),50)}
function unlock(){if(hs($('#pin').value)==db.set.pin){$('#lock').hidden=true}else toast('الكود غلط');$('#pin').value=''}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(db.set.pin&&Date.now()-hid>60000)lockUI()});
function setPin(){const p=prompt('اكتب كود من 4 إلى 8 أرقام (سيبه فاضي لإلغاء القفل)');if(p===null)return;if(!p)delete db.set.pin;else if(/^\d{4,8}$/.test(p))db.set.pin=hs(p);else return alert('الكود لازم يكون أرقام فقط من 4 إلى 8');save();R();toast('تم الحفظ')}
function shareFile(n,t,x){const f=new File([x],n,{type:t});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:n}).catch(()=>{});else download(n,t,x)}
function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',r=[['المجموعة','الطالب','النوع','التاريخ','المبلغ'].map(q).join(',')];
 db.groups.forEach(g=>g.students.forEach(s=>{Object.keys(g.att).sort().forEach(d=>{const v=g.att[d][s.id];if(v!==undefined)r.push([g.name,s.name,v?'حضر':'غاب',d,''].map(q).join(','))});(g.pays[s.id]||[]).forEach(d=>r.push([g.name,s.name,'دفعة',d,g.price||''].map(q).join(',')))}));
 shareFile('دروسي-كشف.csv','text/csv','\ufeff'+r.join('\n'))}

function delEv(d,k,i){if(!confirm('حذف السجل ده؟'))return;const g=G(gid);
 if(k=='p')g.pays[sid].splice(i,1);else{delete g.att[d][sid];if(!Object.keys(g.att[d]).length)delete g.att[d]}save();R()}
function renSt(){const g=G(gid),s=g.students.find(x=>x.id==sid),n=prompt('اسم الطالب',s.name);if(n&&n.trim()){s.name=n.trim();save();R()}}
function moveDlg(){const g=G(gid),s=g.students.find(x=>x.id==sid),o=db.groups.filter(x=>x.id!=gid);
 if(!o.length)return alert('لازم يكون فيه مجموعة تانية الأول');
 $('#dlg').innerHTML=`<h2>نقل ${esc(s.name)}</h2><label>المجموعة الجديدة</label><select id="mg">${o.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.students.length} طالب)</option>`).join('')}</select>
 <label>البيانات</label><div class="opt"><label><input type="radio" name="mk" value="1" checked>انقل معاه سجل الحضور والدفعات</label><label><input type="radio" name="mk" value="0">انقله بدون بيانات (يبدأ من الصفر، وسجله القديم هيتمسح)</label></div>
 <div class="row" style="margin-top:14px"><button class="pri" onclick="moveSt()">نقل</button><button onclick="$('#dlg').close()">إلغاء</button></div>`;$('#dlg').showModal()}
function moveSt(){const g=G(gid),s=g.students.find(x=>x.id==sid),t=G($('#mg').value),keep=document.querySelector('input[name=mk]:checked').value=='1';
 t.students.push(s);
 if(keep){Object.keys(g.att).forEach(d=>{if(g.att[d][sid]!==undefined)(t.att[d]=t.att[d]||{})[sid]=g.att[d][sid]});if(g.pays[sid])t.pays[sid]=g.pays[sid]}
 g.students=g.students.filter(x=>x.id!=sid);delete g.pays[sid];
 Object.keys(g.att).forEach(d=>{delete g.att[d][sid];if(!Object.keys(g.att[d]).length)delete g.att[d]});
 save();$('#dlg').close();gid=t.id;toast('تم نقل '+s.name+' إلى '+t.name);R()}

function mark(sid,v){const g=G(gid);if(cancelled(g,date))return;const a=g.att[date]=g.att[date]||{};if(a[sid]===v)delete a[sid];else a[sid]=v;if(!Object.keys(a).length)delete g.att[date];save();R()}
function addPay(sid){const g=G(gid);(g.pays[sid]=g.pays[sid]||[]).push(date);save();R();toast('تم تسجيل دفعة')}
function undoPay(sid){if(confirm('إلغاء آخر دفعة؟')){G(gid).pays[sid].pop();save();R()}}
function addSt(){const g=G(gid),v=$('#ns').value.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);v.forEach(n=>g.students.push({id:uid(),name:n}));save();R()}
function delSt(id){const g=G(gid),s=g.students.find(x=>x.id==id);if(confirm('حذف '+s.name+' وكل بياناته؟')){g.students=g.students.filter(x=>x.id!=id);delete g.pays[id];Object.keys(g.att).forEach(d=>{delete g.att[d][id];if(!Object.keys(g.att[d]).length)delete g.att[d]});save();go('group')}}
function delGroup(id){if(confirm('حذف المجموعة بكل بياناتها؟')){db.groups=db.groups.filter(g=>g.id!=id);save();go('groups')}}

const dsel=(id,v,none)=>`<select id="${id}">${none?`<option value="-1" ${v<0?'selected':''}>— مفيش —</option>`:''}${[6,0,1,2,3,4,5].map(d=>`<option value="${d}" ${d==v?'selected':''}>${DAYS[d]}</option>`).join('')}</select>`;
function editGroup(id){
 const g=id?G(id):{name:'',price:'',sch:[{d:6,t:'16:00',m:60}]},s1=g.sch[0],s2=g.sch[1]||{d:-1,t:'16:00'};
 $('#dlg').innerHTML=`<h2>${id?'تعديل المجموعة':'مجموعة جديدة'}</h2>
 <label>اسم المجموعة</label><input id="gn" value="${esc(g.name)}">
 <label>سعر الـ 4 حصص (جنيه)</label><input id="gp" type="number" inputmode="numeric" value="${esc(g.price)}">
 <label>اليوم الأول</label><div class="row">${dsel('d1',s1.d)}<input id="t1" type="time" value="${s1.t}"></div>
 <label>اليوم التاني (اختياري)</label><div class="row">${dsel('d2',s2.d,1)}<input id="t2" type="time" value="${s2.t}"></div>
 <label>مدة الحصة (دقيقة)</label><input id="gm" type="number" value="${s1.m||60}">
 <div class="row" style="margin-top:14px"><button class="pri" onclick="saveGroup('${id||''}')">حفظ</button><button onclick="$('#dlg').close()">إلغاء</button></div>`;
 $('#dlg').showModal()}
function saveGroup(id){
 const name=$('#gn').value.trim();if(!name)return alert('اكتب اسم المجموعة');
 const m=+$('#gm').value||60,sch=[{d:+$('#d1').value,t:$('#t1').value||'16:00',m}];
 if($('#d2').value!='-1')sch.push({d:+$('#d2').value,t:$('#t2').value||'16:00',m});
 if(id){Object.assign(G(id),{name,price:$('#gp').value,sch})}else{const n={id:uid(),name,price:$('#gp').value,sch,students:[],att:{},pays:{}};db.groups.push(n);gid=n.id;view='group'}
 save();$('#dlg').close();R();chk(id||gid)}

function download(n,t,x){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:t+';charset=utf-8'}));a.download=n;a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.groups)throw 0;if(confirm('هيتم استبدال البيانات الحالية. متأكد؟')){db=d;save();go('today')}}catch{alert('الملف مش صالح')}};r.readAsText(f)}
function ics(){
 if(!db.groups.length)return alert('أضف مجموعات الأول');
 const p=n=>String(n).padStart(2,'0'),st=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//tutor//AR//','CALSCALE:GREGORIAN'];
 act().forEach(g=>g.sch.forEach((s,i)=>{const d=new Date();d.setHours(12,0,0,0);while(d.getDay()!=s.d)d.setDate(d.getDate()+1);
  const ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+s.t.replace(':','')+'00';
  L.push('BEGIN:VEVENT','UID:'+g.id+i+'@tutor','DTSTAMP:'+st,'DTSTART:'+ds,'DURATION:PT'+(s.m||60)+'M','RRULE:FREQ=WEEKLY;BYDAY='+ICD[s.d],'SUMMARY:درس '+g.name,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:درس '+g.name,'TRIGGER:-PT'+db.set.lead+'M','END:VALARM','END:VEVENT')}));
 L.push('END:VCALENDAR');download('دروسي.ics','text/calendar',L.join('\r\n'))}

function askN(){if(!('Notification'in window))return alert('المتصفح ده مش بيدعم الإشعارات');Notification.requestPermission().then(()=>R())}
function nt(t,b){if(!('Notification'in window)||Notification.permission!='granted')return;
 if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',dir:'rtl',lang:'ar'}));
 else{try{new Notification(t,{body:b})}catch{}}}
function tick(){
 const n=new Date(),k=iso(n),dow=n.getDay(),m=n.getHours()*60+n.getMinutes();
 let sent={};try{sent=JSON.parse(localStorage.getItem('sent'))||{}}catch{}
 Object.keys(sent).forEach(x=>{if(!x.startsWith(k))delete sent[x]});
 const td=[];act().forEach(g=>g.sch.forEach(s=>{if(s.d==dow&&!cancelled(g,k))td.push({g,s})}));
 td.sort((a,b)=>a.s.t.localeCompare(b.s.t));
 const [mh,mm]=(db.set.morning||'08:00').split(':');
 if(td.length&&m>=+mh*60+ +mm&&!sent[k+'m']){nt('دروس النهاردة',td.map(x=>x.g.name+' — '+fmt(x.s.t)).join('\n')+(dues().tot?'\nمطلوب تحصيله '+dues().tot+' جنيه':''));sent[k+'m']=1}
 td.forEach(({g,s})=>{const t=+s.t.slice(0,2)*60+ +s.t.slice(3),key=k+g.id+s.t;
  if(m>=t-db.set.lead&&m<t&&!sent[key]){nt('قرّب درس '+g.name,'الساعة '+fmt(s.t));sent[key]=1}});
 try{localStorage.setItem('sent',JSON.stringify(sent))}catch{}}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(view=='set')R()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(tick,30000);tick();R();lockUI();
</script>
</body>
</html>
